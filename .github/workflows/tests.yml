name: TD tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 run.py --validate
      - run: python3 -m unittest discover tests -v
